<h1>맥북 배터리 제어 1.0.3</h1>
<p>메뉴 막대에서 배터리와 충전 한도를 보고 바꾸는 앱을 응용 프로그램 폴더에 설치합니다.</p>
<p>패치 사항</p>
<ul>
<li>메뉴 막대 상태창 카드 여백이 오른쪽과 위에만 남던 배치를 수정했습니다.</li>
</ul>
<p>설치가 끝나면 Launchpad 또는 응용 프로그램 폴더에서 앱을 여세요. 메뉴 막대에 상태가 표시됩니다.</p>
